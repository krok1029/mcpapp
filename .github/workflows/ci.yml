name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Install Chromium
        run: yarn workspace @mcpapp/ui playwright install --with-deps chromium

      - name: Browser test
        run: yarn test:e2e
